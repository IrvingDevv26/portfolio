<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Irving Dávila — Automatización con IA y desarrollo full-stack</title>
    <meta
      name="description"
      content="Irving Dávila diseña y construye herramientas B2B que convierten trabajo manual en flujos de datos automatizados con APIs de IA, FastAPI, React y servidores Linux."
    />
    <meta name="author" content="Irving de Jesús Dávila Torres" />
    <meta name="theme-color" content="#08090C" />
    <meta name="color-scheme" content="dark" />
    <link rel="canonical" href="%VITE_SITE_URL%/" />

    <!-- Vista previa al compartir (define VITE_SITE_URL en .env) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:title" content="Irving Dávila — Automatización con IA" />
    <meta
      property="og:description"
      content="Herramientas B2B que convierten horas de trabajo manual en flujos de datos automatizados."
    />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.jpg" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <style>
      /* Pantalla de marca mientras llega el JavaScript: React la reemplaza */
      html, body { margin: 0; background: #08090c; }
      .boot { position: fixed; inset: 0; display: grid; place-items: center; }
      .boot__box { display: flex; flex-direction: column; align-items: center; }
      .boot__mark {
        width: 56px; height: 56px; border-radius: 14px; display: grid; place-items: center;
        border: 1px solid rgba(212, 178, 122, 0.5); background: rgba(212, 178, 122, 0.1);
        color: #d4b27a; font: 700 20px/1 system-ui, sans-serif; letter-spacing: -0.02em;
      }
      .boot__bar { width: 120px; height: 2px; margin-top: 20px; overflow: hidden; border-radius: 2px; background: rgba(255, 255, 255, 0.08); }
      .boot__bar i { display: block; width: 40%; height: 100%; background: #d4b27a; animation: boot 1.1s ease-in-out infinite; }
      @keyframes boot { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
      @media (prefers-reduced-motion: reduce) { .boot__bar i { animation: none; width: 100%; opacity: 0.5; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-label="Cargando">
        <div class="boot__box">
          <div class="boot__mark">ID</div>
          <div class="boot__bar"><i></i></div>
        </div>
      </div>
    </div>
    <noscript>
      <p style="color: #f1f3f6; font-family: system-ui, sans-serif; text-align: center; padding: 2rem">
        Irving Dávila — Automatización con IA y desarrollo full-stack. Activa JavaScript para ver el sitio.
      </p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
